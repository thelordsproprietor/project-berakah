[project]
name = "berakah"
version = "0.1.0"
description = "Berakah Ring 1 — typed crypto research engine"
requires-python = ">=3.12,<3.14"
dependencies = [
    "ccxt==4.5.56",
    "duckdb==1.5.3",
    "httpx>=0.27,<0.28",
    "markdown-it-py>=3.0,<4.0",
    "numpy>=2.1,<2.2",
    "obsidiantools==0.11.0",
    "phantom-types==3.0.2",
    "polars==1.41.2",
    "pyarrow==24.0.0",
    "pydantic==2.13.4",
    "pydantic-settings>=2.7,<2.14",
    "python-frontmatter==1.3.0",
    "pyyaml>=6.0,<7.0",
    "rich>=13.0,<14.0",
    "scipy>=1.14,<1.15",
    "structlog==25.5.0",
    "tenacity>=9.0,<10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["berakah"]

[dependency-groups]
dev = [
    "hypothesis==6.155.1",
    "import-linter>=2.0,<3.0",
    "pre-commit>=3.5,<4.0",
    "pyright==1.1.410",
    "pytest==9.0.3",
    "ruff==0.15.16",
]
