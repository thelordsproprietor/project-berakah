[importlinter]
root_packages =
    berakah
include_external_packages = False

# ============================================================================
# Contract 1 — Module DAG (layered architecture)
# Per ARCHITECTURE.md §1.3 (build order):
#   types -> (data, strategy, config) parallel -> backtest -> validation -> vault -> cli
# Downstream layers may import upstream; reverse edges are forbidden.
# ============================================================================
[importlinter:contract:dag]
name = Berakah module DAG (Layer 0 -> 5)
type = layers
layers =
    berakah.cli
    berakah.vault
    berakah.validation
    berakah.backtest
    berakah.data | berakah.strategy
    berakah.config
    (berakah.types)
# Plan 03 ships empty __init__.py placeholders for berakah.cli, berakah.vault,
# berakah.validation, berakah.backtest, berakah.data, berakah.strategy — these
# are infrastructure-not-edge per Pitfall 23 (empty package markers, like
# berakah/py.typed). Their presence pre-arms the forbidden-edge contracts so
# CONFIG-02 can be demonstrably enforced from Phase 1 onward, NOT deferred to
# Phase 3+. berakah.types is wrapped in () because Plan 01-02 owns it and may
# run in parallel — the parentheses make types optional until Plan 02 lands.

# ============================================================================
# Contract 2 — Strategy sandbox (the load-bearing safety asset)
# Per ARCHITECTURE.md §2.4 and PITFALLS.md Pitfall 1, 23:
# Strategies must NEVER import data, vault, or backtest. The look-ahead-as-type
# contract relies on this isolation.
# ============================================================================
[importlinter:contract:strategy-sandbox]
name = Strategy modules cannot import data, vault, or backtest
type = forbidden
source_modules =
    berakah.strategy
forbidden_modules =
    berakah.data
    berakah.vault
    berakah.backtest

# ============================================================================
# Contract 3 — Types layer is pure (Layer 0 has no internal imports)
# Per ARCHITECTURE.md §1.2: berakah.types imports nothing internal.
# Enabled by orchestrator post-Wave-2: berakah/types/ landed in Plan 01-02.
# ============================================================================
[importlinter:contract:types-purity]
name = Types layer cannot import anything internal
type = forbidden
source_modules =
    berakah.types
forbidden_modules =
    berakah.config
    berakah.data
    berakah.strategy
    berakah.backtest
    berakah.validation
    berakah.vault
    berakah.cli

# ============================================================================
# Contract 4 — Config layer imports only types
# Per ARCHITECTURE.md §1.3: config sits at Layer 1 alongside data/strategy.
# It may use types but nothing downstream.
# ============================================================================
[importlinter:contract:config-purity]
name = Config layer cannot import data, strategy, backtest, validation, vault, or cli
type = forbidden
source_modules =
    berakah.config
forbidden_modules =
    berakah.data
    berakah.strategy
    berakah.backtest
    berakah.validation
    berakah.vault
    berakah.cli
