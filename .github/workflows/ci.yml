name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Berakah Ring 1 — lint + types + tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history; import-linter and SHA-binding may need it

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.19"
          enable-cache: true

      - name: Pin Python 3.12
        run: uv python install 3.12

      - name: Sync deps (frozen lockfile)
        run: uv sync --frozen

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Pyright (strict)
        run: uv run pyright

      - name: Import-linter (DAG contracts)
        run: uv run lint-imports --config importlinter.cfg

      - name: Pytest
        run: uv run pytest tests/ -x --tb=short
